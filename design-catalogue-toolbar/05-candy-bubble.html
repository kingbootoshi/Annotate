<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>05 · Candy Bubble</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html,body { height:100%; overflow:hidden; font-family:-apple-system,system-ui,sans-serif; }
  body { background:radial-gradient(1200px 700px at 60% 0%, #232b3d 0%, #12161f 65%); }
  .win { position:absolute; border-radius:12px; background:#1d2330; box-shadow:0 20px 60px rgba(0,0,0,.5); border:1px solid #2b3340; }
  .w1 { left:8%; top:10%; width:44%; height:58%; }
  .tb { height:34px; border-bottom:1px solid #2b3340; display:flex; align-items:center; padding:0 12px; gap:7px; }
  .dot { width:11px; height:11px; border-radius:50%; }
  svg.scribble { position:absolute; inset:0; pointer-events:none; }

  .bar-wrap { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); }
  .bar {
    display:flex; align-items:center; gap:6px; padding:9px 14px;
    border-radius:26px;
    background:rgba(255,255,255,.055);
    -webkit-backdrop-filter:blur(38px) saturate(200%);
    backdrop-filter:blur(38px) saturate(200%);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 18px 46px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.28);
  }
  @keyframes wiggle {
    0%,100%{transform:rotate(0) scale(1.14) translateY(-4px)}
    25%{transform:rotate(-7deg) scale(1.14) translateY(-4px)}
    75%{transform:rotate(7deg) scale(1.14) translateY(-4px)}
  }
  .bub {
    position:relative; width:38px; height:38px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#fff;
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 4px 12px rgba(0,0,0,.3);
    transition:transform .18s cubic-bezier(.3,1.7,.4,1), background .18s, box-shadow .18s;
  }
  .bub svg { width:17px; height:17px; }
  .bub:hover { animation:wiggle .45s ease-in-out; }
  .bub:active { transform:scale(.85); }
  .bub .k {
    position:absolute; top:-7px; right:-5px;
    font:700 8px/1 ui-monospace,monospace; color:#0c0f15;
    background:rgba(255,255,255,.9); padding:2.5px 4.5px; border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.35);
    opacity:0; transform:scale(.5); transition:.18s;
  }
  .bub:hover .k, .bub.on .k { opacity:1; transform:scale(1); }
  .bub.on {
    transform:scale(1.22) translateY(-3px);
    background:var(--tint);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 8px 22px var(--glow), 0 0 0 3px rgba(255,255,255,.14);
  }
  .gap { width:10px; }
  .badge { position:fixed; top:18px; left:22px; color:#8b98ad; font:12px ui-monospace,monospace; }
</style>
</head>
<body>
  <div class="badge">05 · CANDY BUBBLE — round glass bubbles, active tool inflates in its own candy color, keycaps pop on hover</div>
  <div class="win w1"><div class="tb"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span></div></div>
  <svg class="scribble" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M62,26 C70,16 84,22 80,32 C76,42 62,42 66,52" fill="none" stroke="#ff5a4e" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>
  </svg>

  <div class="bar-wrap"><div class="bar" id="bar"></div></div>

<script>
const ICONS = {
  pen:'M3 17l7.5-7.5 4 4L7 21H3v-4zM13.5 6.5l3-3a1.4 1.4 0 012 0l2 2a1.4 1.4 0 010 2l-3 3z',
  high:'M4 15l8-8 5 5-8 8H4v-5zM14 5l2-2 5 5-2 2zM3 22h18v-1.5H3z',
  arrow:'M4 20L18 6M18 6h-7M18 6v7',
  line:'M4 19L20 5',
  rect:'M4 7h16v11H4z',
  circle:'M12 5.5a6.8 6.8 0 110 13.6 6.8 6.8 0 010-13.6z',
  count:'M9 4v16M15 4v16M4 9h16M4 15h16',
  text:'M5 6h14M12 6v13',
  select:'M6 3l12 9-5.2 1L15 19l-2.4 1-2.2-6L6 16z',
  erase:'M8 19l-4-4 9.5-9.5a1.5 1.5 0 012.1 0l3.9 3.9a1.5 1.5 0 010 2.1L12 19H8zM4 21h16',
  color:'M12 3c4.5 4.8 7 8 7 11a7 7 0 11-14 0c0-3 2.5-6.2 7-11z',
  width:'M4 6h16v1H4zM4 11h16v2.4H4zM4 17h16v4H4z',
  fade:'M12 4a8 8 0 100 16 8 8 0 000-16zm0 2.5v11',
  back:'M9 5l-6 7 6 7M3 12h18',
  clear:'M5 7h14l-1.2 13H6.2zM9 7V4h6v3M3.5 7h17',
  undo:'M7 5L3 9l4 4M3 9h11a6 6 0 010 12h-3',
};
const TINT = {
  pen:['rgba(255,120,90,.75)','rgba(255,120,90,.45)'],
  high:['rgba(255,200,60,.75)','rgba(255,200,60,.45)'],
  arrow:['rgba(90,160,255,.75)','rgba(90,160,255,.45)'],
  line:['rgba(80,220,255,.7)','rgba(80,220,255,.4)'],
  rect:['rgba(160,120,255,.75)','rgba(160,120,255,.45)'],
  circle:['rgba(60,220,190,.75)','rgba(60,220,190,.45)'],
  count:['rgba(255,110,150,.75)','rgba(255,110,150,.45)'],
  text:['rgba(200,210,230,.7)','rgba(200,210,230,.4)'],
  select:['rgba(150,165,190,.7)','rgba(150,165,190,.4)'],
  erase:['rgba(255,140,220,.75)','rgba(255,140,220,.45)'],
};
const tools=[['pen','P'],['high','H'],['arrow','A'],['line','L'],['rect','R'],['circle','O'],['count','N'],['text','T'],['select','V'],['erase','E']];
const utils=[['color','C'],['width','W'],['fade','␣'],['back','⌫'],['clear','⌥⌫'],['undo','⌘Z']];
const bar=document.getElementById('bar');
function svg(n){return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"><path d="${ICONS[n]}"/></svg>`;}
let bubs=[];
tools.forEach(([n,k])=>{
  const b=document.createElement('div'); b.className='bub';
  const [tint,glow]=TINT[n];
  b.style.setProperty('--tint',tint); b.style.setProperty('--glow',glow);
  b.innerHTML=svg(n)+`<span class="k">${k}</span>`;
  bar.appendChild(b); bubs.push(b);
  b.onclick=()=>{bubs.forEach(x=>x.classList.remove('on')); b.classList.add('on');};
});
const gap=document.createElement('div'); gap.className='gap'; bar.appendChild(gap);
utils.forEach(([n,k])=>{
  const b=document.createElement('div'); b.className='bub';
  b.innerHTML=svg(n)+`<span class="k">${k}</span>`;
  bar.appendChild(b);
  b.onclick=()=>{b.style.transform='scale(1.3)'; setTimeout(()=>b.style.transform='',180);};
});
bubs[1].classList.add('on');
</script>
</body>
</html>
