<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>01 · Liquid Glass Capsule</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; overflow:hidden; font-family:-apple-system,system-ui,sans-serif; }
  body {
    background:
      radial-gradient(1200px 600px at 70% 10%, #2b3a55 0%, transparent 60%),
      radial-gradient(900px 500px at 20% 80%, #3a2b4d 0%, transparent 55%),
      #171c26;
  }
  .win { position:absolute; border-radius:12px; background:#1e242f; box-shadow:0 20px 60px rgba(0,0,0,.5); border:1px solid #2c3442; }
  .w1 { left:6%; top:8%; width:46%; height:64%; }
  .w2 { right:5%; top:16%; width:38%; height:58%; }
  .tb { height:34px; border-bottom:1px solid #2c3442; display:flex; align-items:center; padding:0 12px; gap:7px; }
  .dot { width:11px; height:11px; border-radius:50%; }
  .code { padding:16px; color:#5d6b82; font:13px/1.7 ui-monospace,monospace; }
  .code em { color:#7ea87f; font-style:normal; }
  svg.scribble { position:absolute; inset:0; pointer-events:none; }

  .bar-wrap { position:absolute; bottom:26px; left:50%; transform:translateX(-50%); }
  .bar {
    display:flex; align-items:center; gap:2px; padding:7px 10px;
    border-radius:22px;
    background:rgba(255,255,255,.07);
    -webkit-backdrop-filter:blur(36px) saturate(190%);
    backdrop-filter:blur(36px) saturate(190%);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:
      0 18px 44px rgba(0,0,0,.45),
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -1px 0 rgba(0,0,0,.18);
    position:relative;
  }
  .lens {
    position:absolute; top:6px; height:calc(100% - 12px); border-radius:15px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.22);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 4px 14px rgba(0,0,0,.25);
    transition:left .32s cubic-bezier(.32,1.4,.36,1), width .32s cubic-bezier(.32,1.4,.36,1);
    pointer-events:none;
  }
  .chip {
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:5px 11px 4px; border-radius:14px; cursor:pointer;
    color:rgba(255,255,255,.82);
    transition:transform .18s cubic-bezier(.32,1.6,.36,1), color .18s;
  }
  .chip:hover { transform:translateY(-3px) scale(1.08); color:#fff; }
  .chip:active { transform:translateY(0) scale(.94); }
  .chip svg { width:17px; height:17px; display:block; }
  .chip .k {
    font-size:8.5px; font-weight:600; letter-spacing:.4px; opacity:.5;
    font-family:ui-monospace,monospace;
  }
  .chip.on { color:#fff; }
  .chip.on .k { opacity:.85; }
  .sep { width:1px; height:22px; background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.25),rgba(255,255,255,0)); margin:0 5px; }
  .chip.color svg { color:#ff6259; }
  .hint { position:absolute; top:-30px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.35); font-size:11px; white-space:nowrap; }
  .badge { position:fixed; top:18px; left:22px; color:#8b98ad; font:12px ui-monospace,monospace; }
</style>
</head>
<body>
  <div class="badge">01 · LIQUID GLASS CAPSULE — one pane of frosted glass, sliding lens marks the tool</div>
  <div class="win w1"><div class="tb"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span></div>
    <div class="code">$ bun run dev<br><em>ready on :3000 in 84ms</em><br>…<br>watching for changes</div></div>
  <div class="win w2"><div class="tb"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span></div>
    <div class="code">TODO<br>— ship the toolbar<br>— pick a glass</div></div>
  <svg class="scribble" viewBox="0 0 100 100" preserveAspectRatio="none">
    <path d="M18,30 C24,18 34,20 32,30 C30,40 20,42 24,50" fill="none" stroke="#ff5a4e" stroke-width="1.1" stroke-linecap="round" opacity=".9"/>
  </svg>

  <div class="bar-wrap">
    <div class="hint">⌥H toggles · click anything</div>
    <div class="bar" id="bar">
      <div class="lens" id="lens"></div>
    </div>
  </div>

<script>
const ICONS = {
  pen:'M3 17l7.5-7.5 4 4L7 21H3v-4zM13.5 6.5l3-3a1.4 1.4 0 012 0l2 2a1.4 1.4 0 010 2l-3 3z',
  high:'M4 15l8-8 5 5-8 8H4v-5zM14 5l2-2 5 5-2 2zM3 22h18v-1.5H3z',
  arrow:'M4 20L18 6M18 6h-7M18 6v7',
  line:'M4 19L20 5',
  rect:'M4 7h16v11H4z',
  circle:'M12 5.5a6.8 6.8 0 110 13.6 6.8 6.8 0 010-13.6z',
  count:'M9 4v16M15 4v16M4 9h16M4 15h16',
  text:'M5 6h14M12 6v13',
  select:'M6 3l12 9-5.2 1L15 19l-2.4 1-2.2-6L6 16z',
  erase:'M8 19l-4-4 9.5-9.5a1.5 1.5 0 012.1 0l3.9 3.9a1.5 1.5 0 010 2.1L12 19H8zM4 21h16',
  color:'M12 3c4.5 4.8 7 8 7 11a7 7 0 11-14 0c0-3 2.5-6.2 7-11z',
  width:'M4 6h16v1H4zM4 11h16v2.4H4zM4 17h16v4H4z',
  fade:'M12 4a8 8 0 100 16 8 8 0 000-16zm0 2.5v11',
  back:'M9 5l-6 7 6 7M3 12h18',
  clear:'M5 7h14l-1.2 13H6.2zM9 7V4h6v3M3.5 7h17',
  undo:'M7 5L3 9l4 4M3 9h11a6 6 0 010 12h-3',
};
function icon(d, stroke=true){
  return `<svg viewBox="0 0 24 24" fill="${stroke?'none':'currentColor'}" stroke="${stroke?'currentColor':'none'}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="${d}"/></svg>`;
}
const items = [
  ['pen','P',true],['high','H',true],['arrow','A',true],['line','L',true],['rect','R',true],
  ['circle','O',true],['count','N',true],['text','T',true],['select','V',true],['erase','E',true],
  'sep',
  ['color','C',true],['width','W',true],['fade','␣',true],
  'sep',
  ['back','⌫',true],['clear','⌥⌫',true],['undo','⌘Z',true],
];
const bar = document.getElementById('bar');
const lens = document.getElementById('lens');
let chips = [];
items.forEach(it=>{
  if(it==='sep'){ const s=document.createElement('div'); s.className='sep'; bar.appendChild(s); return; }
  const [name,k] = it;
  const c=document.createElement('div');
  c.className='chip'+(name==='color'?' color':'');
  c.innerHTML = icon(ICONS[name], !(name==='color')) + `<span class="k">${k}</span>`;
  bar.appendChild(c);
  if(['pen','high','arrow','line','rect','circle','count','text','select','erase'].includes(name)){
    chips.push(c);
    c.onclick=()=>setActive(c);
  } else {
    c.onclick=()=>{ c.style.transform='translateY(-6px) scale(1.15)'; setTimeout(()=>c.style.transform='',200); };
  }
});
function setActive(c){
  chips.forEach(x=>x.classList.remove('on'));
  c.classList.add('on');
  lens.style.left = (c.offsetLeft)+'px';
  lens.style.width = (c.offsetWidth)+'px';
}
setActive(chips[1]);
</script>
</body>
</html>
